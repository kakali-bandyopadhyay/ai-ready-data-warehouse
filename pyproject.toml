[project]
name = "ai-ready-data-warehouse"
version = "0.1.0"
description = "Synthetic private-markets warehouse with an AI-ready retrieval layer"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["generator", "pipeline", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

